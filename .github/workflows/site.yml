name: Build & publish job site

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      # Keeps "first seen" dates and discovered boards between runs.
      - uses: actions/cache@v4
        with:
          path: data
          key: job-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            job-data-${{ github.ref_name }}-
            job-data-main-

      - name: Scan boards and build site
        run: node scripts/build.js
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}

      - name: Probe candidate boards (temporary)
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        run: node scripts/probe.js

      - name: Check browser (CORS) access to the job APIs
        continue-on-error: true
        run: |
          for u in https://boards-api.greenhouse.io/v1/boards/drw/jobs https://api.ashbyhq.com/posting-api/job-board/ramp; do
            echo "== $u"; curl -s -o /dev/null -D - -H 'Origin: https://example.github.io' "$u" | grep -i -E '^(HTTP|access-control)' || true
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
